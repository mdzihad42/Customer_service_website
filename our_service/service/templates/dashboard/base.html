<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Digital Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --text-color: #e2e8f0;
            --primary-color: #3b82f6;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .brand {
            padding: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
        }

        .menu {
            flex: 1;
            padding: 1rem;
            list-style: none;
        }

        .menu li {
            margin-bottom: 0.5rem;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .menu a:hover,
        .menu a.active {
            background: var(--primary-color);
            color: white;
        }

        .logout {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 40%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: #94a3b8;
            font-weight: 600;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        /* Helpers */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            background: #334155;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <aside class="sidebar">
        <div class="brand">DevSquad Admin</div>
        <ul class="menu">
            <li><a href="{% url 'dashboard_home' %}"
                    class="{% if request.path == '/custom-admin/' %}active{% endif %}"><i class="fas fa-home"></i>
                    Dashboard</a></li>
            <li><a href="{% url 'dashboard_services' %}"><i class="fas fa-code"></i> Services</a></li>
            <li><a href="{% url 'dashboard_projects' %}"><i class="fas fa-briefcase"></i> Projects</a></li>
            <li><a href="{% url 'dashboard_blogs' %}"><i class="fas fa-newspaper"></i> Blog</a></li>
            <li><a href="{% url 'dashboard_team' %}"><i class="fas fa-users"></i> Team</a></li>
            <li><a href="{% url 'dashboard_testimonials' %}"><i class="fas fa-comment-alt"></i> Testimonials</a></li>
            <li><a href="{% url 'dashboard_contacts' %}"><i class="fas fa-envelope"></i> Messages</a></li>
            <li><a href="{% url 'dashboard_profile' %}"><i class="fas fa-info-circle"></i> About Page</a></li>
            <li><a href="{% url 'dashboard_office' %}"><i class="fas fa-building"></i> Office Info</a></li>
            <li><a href="{% url 'dashboard_chat' %}"><i class="fas fa-comments"></i> Live Chat</a></li>
        </ul>
        <div class="logout">
            <a href="{% url 'admin:logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>

</html>
