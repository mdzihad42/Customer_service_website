{% extends 'dashboard/base.html' %}

{% block content %}
<div class="header">
    <h1>Blog Posts</h1>
    <a href="{% url 'dashboard_blog_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> New Post</a>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for post in posts %}
            <tr>
                <td>{{ post.title }}</td>
                <td>{{ post.author.username }}</td>
                <td>{{ post.created_at|date:"M d, Y" }}</td>
                <td>
                    <a href="{% url 'dashboard_blog_edit' post.id %}" class="btn btn-primary"
                        style="padding: 0.3rem 0.6rem;"><i class="fas fa-edit"></i></a>
                    <a href="{% url 'dashboard_blog_delete' post.id %}" class="btn btn-danger"
                        style="padding: 0.3rem 0.6rem;" onclick="return confirm('Are you sure?')"><i
                            class="fas fa-trash"></i></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
