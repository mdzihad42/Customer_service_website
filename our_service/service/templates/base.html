<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Solutions | Premium Services</title>

    <!-- PWA -->
    <link rel="manifest" href="{% url 'manifest' %}">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9358/9358763.png">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --primary-color: #3b82f6;
            --secondary-color: #8b5cf6;
            --accent-color: #06b6d4;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            /* Removes bottom spacing */
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* Glassmorphism Generic Class */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            padding: 1rem 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* Chat Widget */
        .chat-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .chat-toggle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            transition: transform 0.3s;
        }

        .chat-toggle:hover {
            transform: scale(1.1);
        }

        .chat-box {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 350px;
            height: 500px;
            display: none;
            /* Hidden by default */
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .chat-box.active {
            display: flex;
            animation: slideUp 0.3s ease-out;
        }

        .chat-header {
            padding: 1rem;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .message {
            max-width: 80%;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--glass-border);
            color: white;
            border-bottom-left-radius: 2px;
        }

        .chat-input {
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex: 1;
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .chat-input button {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Menu */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .bar {
            width: 25px;
            height: 3px;
            background-color: var(--text-color);
            margin: 3px 0;
            transition: 0.4s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                top: 15px;
                /* Slightly higher on mobile */
                left: 1rem;
                /* Fixed margin left */
                right: 1rem;
                /* Fixed margin right */
                width: auto;
                /* Auto width based on left/right */
                transform: none;
                /* Remove centering transform */
                padding: 1rem;
            }

            .menu-toggle {
                display: flex;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--bg-color);
                flex-direction: column;
                padding: 2rem;
                border-radius: 16px;
                border: 1px solid var(--glass-border);
                text-align: center;
                margin-top: 1rem;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            .nav-links.active {
                display: flex;
            }

            .chat-widget {
                bottom: 20px;
                right: 20px;
            }

            .chat-box {
                width: 300px;
                right: -20px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav class="glass">
        <a href="{% url 'home' %}" class="logo">DevSquad</a>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}#services">Services</a></li>
            <li><a href="{% url 'project_list' %}">Projects</a></li>
            <li><a href="{% url 'blog_list' %}">Blog</a></li>
            <li><a href="{% url 'about_us' %}">About Us</a></li>
            <li><a href="{% url 'home' %}#team">Team</a></li>
            <li><a href="{% url 'home' %}#contact">Contact</a></li>
        </ul>
    </nav>

    {% block content %}{% endblock %}

    <!-- Chat Widget -->
    <div class="chat-widget">
        <div class="chat-box glass" id="chatBox">
            <div class="chat-header">
                <h3>Live Support</h3>
                <i class="fas fa-times" onclick="toggleChat()" style="cursor: pointer;"></i>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will load here -->
            </div>
            <div class="chat-input glass">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        <div class="chat-toggle" onclick="toggleChat()">
            <i class="fas fa-comments fa-lg"></i>
            <span id="chat-badge"
                style="position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 0.75rem; display: none; align-items: center; justify-content: center; border: 2px solid var(--bg-color);">0</span>
        </div>
    </div>

    <script>
        // Chat Logic
        const chatBox = document.getElementById('chatBox');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatBadge = document.getElementById('chat-badge');

        // Mobile Menu Logic
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links');

        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        function toggleChat() {
            chatBox.classList.toggle('active');
            if (chatBox.classList.contains('active')) {
                scrollToBottom();
                fetchMessages();
                markMessagesAsRead();
            }
        }

        async function markMessagesAsRead() {
            try {
                await fetch('{% url "chat_mark_read" %}', { method: 'POST' });
                chatBadge.style.display = 'none';
                chatBadge.textContent = '0';
            } catch (error) {
                console.error("Error marking read:", error);
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessage(msg, isSent) {
            const div = document.createElement('div');
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            div.textContent = msg;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Optimistic UI update
            appendMessage(text, true);
            chatInput.value = '';

            try {
                const formData = new FormData();
                formData.append('message', text);

                await fetch('{% url "chat_send" %}', {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }

        async function fetchMessages() {
            // If chat is open, fetch full history
            if (chatBox.classList.contains('active')) {
                try {
                    const response = await fetch('{% url "chat_get" %}');
                    const data = await response.json();

                    chatMessages.innerHTML = '';
                    data.forEach(msg => {
                        const isSent = !msg.is_admin;
                        appendMessage(msg.message, isSent);
                    });
                } catch (error) {
                    console.error('Error fetching messages:', error);
                }
            }
        }

        async function checkNotifications() {
            // Always check for notifications if chat is closed
            if (!chatBox.classList.contains('active')) {
                try {
                    const response = await fetch('{% url "chat_notifications" %}');
                    const data = await response.json();
                    if (data.unread_count > 0) {
                        chatBadge.textContent = data.unread_count;
                        chatBadge.style.display = 'flex';
                    } else {
                        chatBadge.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Error checking notifications:', error);
                }
            }
        }

        // Poll for new messages/notifications every 3 seconds
        setInterval(() => {
            fetchMessages();
            checkNotifications();
        }, 3000);

        // Enter key to send
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
    {% block extra_js %}{% endblock %}

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register("{% url 'service_worker' %}")
                    .then(function (registration) {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, function (err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>

</html>
